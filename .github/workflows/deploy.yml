name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-build]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore work orders cache
        id: cache-orders
        uses: actions/cache@v4
        with:
          path: work-orders-cache.json
          key: work-orders-cache-v1
      - run: npm ci
      - run: npm run build
        env:
          UPKEEP_EMAIL: ${{ secrets.UPKEEP_EMAIL }}
          UPKEEP_PASSWORD: ${{ secrets.UPKEEP_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
